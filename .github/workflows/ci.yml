name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and analyze (verify)
        shell: bash
        run: ./mvnw -B clean verify

      - name: Read project version
        id: version
        shell: bash
        run: |
          v=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout | tail -n 1 | tr -d '\r')
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Check --version output
        shell: bash
        run: |
          out=$(java -jar target/lab01-${{ steps.version.outputs.value }}.jar --version | tr -d '\r')
          echo "$out"
          test "$out" = "lab01 ${{ steps.version.outputs.value }}"

      - name: Check Git tag matches pom version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v${{ steps.version.outputs.value }}"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.os }}-${{ github.run_number }}
          path: target/lab01-${{ steps.version.outputs.value }}.jar
          if-no-files-found: error